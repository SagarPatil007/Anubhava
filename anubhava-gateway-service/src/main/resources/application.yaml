spring:
  application:
    name: anubhava-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:3000
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: '*'
                allowCredentials: true
          routes:
            - id: auth-service
              uri: lb://anubhava-auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: lb://anubhava-user-service
              predicates:
                - Path=/api/v1/users/**
            - id: event-service
              uri: lb://anubhava-event-service
              predicates:
                - Path=/api/v1/event/**
            - id: booking-service
              uri: lb://anubhava-booking-service
              predicates:
                - Path=/api/v1/booking/**
server:
  port: 8080
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
      cors:
        allowed-origins:
          - http://localhost:3000
        allowed-methods:
          - GET
