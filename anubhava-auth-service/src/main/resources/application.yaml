server:
  port: 8081
spring:
  application:
    name: anubhava-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/anubhava_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:anubhava}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  client-id: ${KEYCLOAK_CLIENT_ID:anubhava-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:Gvhxj3M0bejmXP8LLFtZRtJ40LjsuZXpsPaz7oyNmEDsYXp93GK532G6ktk5j9y8a5swj7v3q8ucHNRnOXXafO}
user-service:
  url: ${USER_SERVICE_URL:http://localhost:8082}
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance:
  prefer-ip-address: true
